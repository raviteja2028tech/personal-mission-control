services:
  - type: web
    name: pmc-backend
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://personal-mission-control-7269a.web.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
